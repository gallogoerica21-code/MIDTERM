services:
  - type: web
    name: campinventory
    runtime: python
    plan: free
    branch: master
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT web_app:app
    healthCheckPath: /_ping
    autoDeploy: true
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: gallogoerica21@gmail.com
      - key: BREVO_NOTIFICATION_EMAIL
        value: gallogoerica21@gmail.com
